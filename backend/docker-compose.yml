version: '3.7'

services:
  nestjs:
    build: .
    ports:
      - "3001:3000"
    environment:
      - TZ=Asia/Dubai
      - DB_SYNCHRONIZE=true
    volumes:
      - ./src:/usr/src/app/src
      - ./uploads:/usr/src/app/uploads
      - ./dist/mail/templates:/usr/src/app/dist/mail/templates
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:5.7
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: arc
      TZ: Asia/Dubai
    volumes:
    - ./mysql-data:/var/lib/mysql
    - ./my.cnf:/etc/mysql/my.cnf

  redis:
    image: redis
    ports:
      - "6379:6379"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always