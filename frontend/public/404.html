<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Route Facile</title>
    <!-- No canonical here on purpose. Pointing a missing URL at itself asks
         Google to index a page that does not exist; pointing it at the home page
         tells Google this URL *is* the home page. Neither is true. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f5f7fa; color: #0D1B2A; padding: 24px;
      }
      .wrap { max-width: 560px; text-align: center; }
      .logo { width: 190px; height: auto; margin-bottom: 28px; }
      .code { font-size: 4.5rem; font-weight: 800; line-height: 1; color: #E02F12; margin: 0 0 8px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { font-size: 1rem; line-height: 1.6; color: #4a5568; margin: 0 0 28px; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      a.btn {
        display: inline-block; padding: 12px 22px; border-radius: 10px;
        text-decoration: none; font-weight: 600; font-size: 0.95rem;
      }
      .primary { background: #E02F12; color: #fff; }
      .secondary { background: #fff; color: #0D1B2A; border: 1px solid #d1dbe8; }
      .links { margin-top: 32px; font-size: 0.9rem; }
      .links a { color: #0D1B2A; margin: 0 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/images/logo-header-v4.webp" alt="Route Facile" class="logo" width="256" height="71" />
      <p class="code">404</p>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>
        The page you are looking for has moved or never existed. You can start a new
        booking from the home page, or browse the fleet.
      </p>
      <div class="actions">
        <a class="btn primary" href="/en">Book a car</a>
        <a class="btn secondary" href="/en/ourfleetlist">Browse the fleet</a>
      </div>
      <div class="links">
        <a href="/en/location">Locations</a> ·
        <a href="/en/contact">Contact</a> ·
        <a href="/en/faq">FAQ</a> ·
        <a href="/fr">Français</a> ·
        <a href="/ar">العربية</a>
      </div>
    </div>
  </body>
</html>
