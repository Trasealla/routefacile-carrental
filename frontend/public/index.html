<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- MUST stay directly after <meta charset> and BEFORE any media-gated
         preload below. The preload scanner evaluates a preload's `media`
         against the viewport it knows about at that moment; until this tag is
         parsed that is Chrome's 980px fallback, not the device width. With the
         viewport declared later, phones matched "(min-width: 768px)" and
         preloaded the 161 KB desktop hero they never display. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ── Google Tag Manager ───────────────────────────────────────────
         Container GTM-MVTPG3QM. Placed after <meta charset> and viewport so
         the preload scanner still evaluates the media-gated hero preloads
         against the real device width, and marked async by the snippet itself
         so it never blocks the first render.

         Note: GA4 (G-W3Q4FEM68C) is loaded directly by the app, NOT through
         this container. Do not add a GA4 Configuration tag in GTM as well or
         every page view and booking event is counted twice. Use GTM for the
         tags the app does not fire itself — Google Ads, Meta Pixel, etc. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

        var loaded = false;
        function loadGtm() {
          if (loaded) return;
          loaded = true;
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        }

        // GTM is 110 KiB of script, and it pulls its own copy of gtag on top of
        // that. Loading it in the <head> put ~478 KiB of analytics in front of
        // the first paint on a phone. Nothing in the container affects what the
        // customer sees, so it waits for the browser to go idle — or for the
        // first real interaction, whichever comes first, so a visitor who taps
        // straight into the booking form is still measured.
        var EVENTS = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
        function onFirstInteraction() {
          EVENTS.forEach(function (e) { w.removeEventListener(e, onFirstInteraction, true); });
          loadGtm();
        }
        EVENTS.forEach(function (e) {
          w.addEventListener(e, onFirstInteraction, { capture: true, passive: true, once: true });
        });

        if ('requestIdleCallback' in w) {
          w.requestIdleCallback(loadGtm, { timeout: 5000 });
        } else {
          w.addEventListener('load', function () { setTimeout(loadGtm, 2500); });
        }
      })(window, document, 'script', 'dataLayer', 'GTM-MVTPG3QM');
    </script>
    <!-- End Google Tag Manager -->

    <!-- ── SearchAtlas OTTO SEO pixel ─────────────────────────────────
         Project 634b871d-3bc4-488f-9035-b875de5e90ca. This is how OTTO
         actually applies the fixes staff approve in the SearchAtlas dashboard
         (or via the /deploy/ API) — it rewrites the relevant parts of the
         live page client-side. Nothing changes on the site just from this
         script being present; it only acts on fixes that have been deployed
         for this project, same review gate as the article webhook. -->
    <script nowprocket nitro-exclude type="text/javascript" id="sa-dynamic-optimization" data-uuid="634b871d-3bc4-488f-9035-b875de5e90ca" src="https://dashboard.searchatlas.com/scripts/dynamic_optimization.js"></script>

    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
    <!-- Hero preloads are split by viewport to match the <picture> in
         HeroSection.jsx. Previously only the desktop crop was preloaded, with no
         media query, so phones downloaded a 160 KB image they never displayed
         on top of the mobile crop they actually needed. -->
    <!-- Mobile hero preload mirrors the <picture> in HeroSection.jsx exactly:
         same type, same srcset, same sizes. If they drift the browser preloads
         one file and then downloads a different one — two hero downloads on the
         critical path instead of none. AVIF only: every browser that lacks AVIF
         support also ignores this preload and falls back to the WebP source. -->
    <link rel="preload" as="image" media="(max-width: 767px)" type="image/avif" fetchpriority="high"
          imagesrcset="/images/banners/rf-hero-m-414.avif 414w, /images/banners/rf-hero-m-640.avif 640w, /images/banners/rf-hero-m-828.avif 828w"
          imagesizes="100vw" />
    <!-- Desktop, split at the same 1600px breakpoint the <picture> uses. A single
         preload of the 1280 crop meant wide screens fetched it and then fetched
         the 1535 crop the <picture> actually selected — the hero downloaded
         twice, both times on the critical path. AVIF for the same reason as
         mobile: half the bytes of the WebP at the same quality, and browsers
         without AVIF skip the preload and take the WebP source below. -->
    <link rel="preload" as="image" media="(min-width: 768px) and (max-width: 1599px)" href="/images/banners/rf-hero-desktop-1280-v3.avif" type="image/avif" fetchpriority="high" />
    <link rel="preload" as="image" media="(min-width: 1600px)" href="/images/banners/rf-hero-desktop-v3.avif" type="image/avif" fetchpriority="high" />

    <!-- The header logo is the LCP element on phones. It is rendered by React,
         so without this the browser cannot discover it until the bundle has
         booted. Split the same way as the <picture> in HeaderNew.jsx: the colour
         mark below 992px, the white mark above. -->
    <link rel="preload" as="image" media="(max-width: 991px)" href="/images/logo-header-v4.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" media="(min-width: 992px)" href="/images/logo-footer-white-v3.webp" type="image/webp" fetchpriority="high" />

    <!-- Start fetching the active language file immediately instead of waiting
         for the JS bundle to boot and ask for it. The language is the first path
         segment (/en, /fr, /ar), so it can only be resolved at runtime. -->
    <script>
      (function () {
        var seg = (location.pathname.split("/")[1] || "").toLowerCase();
        var lng = ["en", "fr", "ar"].indexOf(seg) > -1 ? seg : "en";
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "fetch";
        l.href = "/locales/" + lng + "/translation.json";
        l.type = "application/json";
        l.crossOrigin = "anonymous";
        document.head.appendChild(l);
      })();
    </script>

    <!-- ── Hreflang is emitted per URL, not here ────────────────────────
         This file is the shell for every route, so any hreflang set in it is
         correct for at most one URL and wrong for the rest — it used to claim
         every page was the home page of a host we no longer run. The
         prerenderer writes a correct self-referencing set into each page, and
         react-helmet emits one for routes it renders client-side. -->

    <!-- ── Performance: preconnect to critical third parties ─────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />

    <!-- Google Fonts — non-blocking. Only Source Sans Pro is actually used
         (the global `* { font-family: ... !important }` rule overrides every
         other font). display=optional avoids the font-swap reflow (CLS), and
         loading it here instead of via CSS @import keeps it OFF the critical
         request chain so it downloads in parallel with the stylesheet. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@200;300;400;600;700;900&display=optional" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@200;300;400;600;700;900&display=optional" /></noscript>

    <!-- Playfair Display — elegant serif used only for the hero headline (Blacklane-style). -->

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" /></noscript>

    <!-- Font Awesome — self-hosted SUBSET: only the ~66 icons this site uses.

    <link rel="preload" as="font" type="font/woff2" href="/fa/fa-solid-900.subset.woff2" crossorigin="anonymous" />
    <!-- Loaded async (not render-blocking): icons are not needed for first paint,
         so they swap in a few ms later instead of delaying FCP/LCP. -->
    <link rel="preload" as="style" href="/fa/fa-subset.css?v=3" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fa/fa-subset.css?v=3" /></noscript>
