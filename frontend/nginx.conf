# ── Redirect HTTP → HTTPS and non-www → www ──
# When behind a load balancer that terminates SSL, use X-Forwarded-Proto instead.
# Uncomment the block below if running nginx directly with SSL:
# server {
#     listen 80;
#     server_name autostrad.com www.autostrad.com;
#     return 301 https://www.autostrad.com$request_uri;
# }
# server {
#     listen 443 ssl;
#     server_name autostrad.com;
#     return 301 https://www.autostrad.com$request_uri;
# }

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # ── SEO: Redirect common duplicate URLs ──
    # Redirect legacy uppercase routes — client-side LowercaseRedirect.js handles
    # the rest, and canonical tags tell Google the authoritative URL

    # ── 410 Gone: Spam / junk URLs (no valid page ever existed) ──
    location ~ ^/(115-north-west-b-street|which-citrus-fruit-with-vinegar|some-potty-reading|fgzuj|3606-north-tuscany)$ {
        return 410;
    }

    # ── 410 Gone: Legacy admin/API URLs that should not exist ──
    location ~ ^/(en|ae|ar)/home/set_website_setting {
        return 410;
    }

    # ── Block search query URLs ──
    location = /search {
        return 301 $scheme://$host/en$is_args$args;
    }

    # ── Redirect bare paths without language prefix to /en/ ──
    location = /car-rental {
        return 301 $scheme://$host/en/car-rental$is_args$args;
    }
    location = /car-rental-jlt {
        return 301 $scheme://$host/en/car-rental-jlt$is_args$args;
    }

    # ── Redirect bare / to /en/ for canonical homepage ──
    location = / {
        return 301 $scheme://$host/en$is_args$args;
    }

    # ── Redirect /en/home and /ae/home to /en/ and /ae/ ──
    location ~ ^/(en|ae)/home$ {
        return 301 $scheme://$host/$1$is_args$args;
    }

    # ── Old route: /careers → /careerspage ──
    location ~ ^/(en|ae|ar)/careers$ {
        return 301 $scheme://$host/$1/careerspage$is_args$args;
    }

    # ── Old route: /about-us → /about ──
    location ~ ^/(en|ae|ar)/about-us$ {
        return 301 $scheme://$host/$1/about$is_args$args;
    }

    # ── Old route: /terms-and-conditions → /termscondition ──
    location ~ ^/(en|ae|ar)/terms-and-conditions$ {
        return 301 $scheme://$host/$1/termscondition$is_args$args;
    }

    # ── Old route: /buses-and-commercial-vehicles → /commercialvehicles ──
    location ~ ^/(en|ae|ar)/buses-and-commercial-vehicles$ {
        return 301 $scheme://$host/$1/commercialvehicles$is_args$args;
    }

    # ── Old route: /enquiry → /contact ──
    location ~ ^/(en|ae|ar)/enquiry$ {
        return 301 $scheme://$host/$1/contact$is_args$args;
    }

    # ── Old route: /arquiry (Arabic typo) → /contact ──
    location ~ ^/(en|ae|ar)/arquiry$ {
        return 301 $scheme://$host/$1/contact$is_args$args;
    }

    # ── Old route: /carguide → /ourfleetlist ──
    location ~ ^/(en|ae|ar)/carguide$ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }

    # ── Old route: /cardetail/:id → /cars/:id ──
    location ~ ^/(en|ae|ar)/cardetail/(\d+)$ {
        return 301 $scheme://$host/$1/cars/$2$is_args$args;
    }

    # ── Old route: /car_rental_service_location/* → /location ──
    location ~ ^/(en|ae|ar)/car_rental_service_location/ {
        return 301 $scheme://$host/$1/location$is_args$args;
    }

    # ── Old route: /car_rartal_service_location/* (Arabic typo) → /location ──
    location ~ ^/(en|ae|ar)/car_rartal_service_location/ {
        return 301 $scheme://$host/$1/location$is_args$args;
    }

    # ── Old route: /emirates_car_rental/* → /ourfleetlist ──
    location ~ ^/(en|ae|ar)/emirates_car_rental/ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }

    # ── Old route: /emirates_car_rartal/* (Arabic typo) → /ourfleetlist ──
    location ~ ^/(en|ae|ar)/emirates_car_rartal/ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }

    # ── Old route: /offer_details/:id → /offerspage ──
    location ~ ^/(en|ae|ar)/offer_details/ {
        return 301 $scheme://$host/$1/offerspage$is_args$args;
    }

    # ── Old route: /blog/:slug (singular, no ID) → /blogs ──
    location ~ ^/(en|ae|ar)/blog/ {
        return 301 $scheme://$host/$1/blogs$is_args$args;
    }

    # ── Old route: /neighbourhood/* → /en home (legacy) ──
    location ~ ^/(en|ae|ar)/neighbourhood/ {
        return 301 $scheme://$host/$1$is_args$args;
    }

    # ── Old slug: rent-a-car-in-al-ruwais → canonical rent-a-car-in-al-dhannah-ex-ruwais ──
    location ~ ^/(en|ae|ar)/emirateservice/rent-a-car-in-al-ruwais-5$ {
        return 301 $scheme://$host/$1/emirateservice/rent-a-car-in-al-dhannah-ex-ruwais-5$is_args$args;
    }

    # ── Fix camelCase after LowercaseRedirect: contectuspage → contact-us ──
    location ~ ^/(en|ae|ar)/contectuspage$ {
        return 301 $scheme://$host/$1/contact-us$is_args$args;
    }

    # ── Fix camelCase after LowercaseRedirect: leasingcorporatepage → corporate-leasing ──
    location ~ ^/(en|ae|ar)/leasingcorporatepage$ {
        return 301 $scheme://$host/$1/corporate-leasing$is_args$args;
    }

    # ── Fix duplicate canonical: camelCase routes that lowercase differently ──
    # React's LowercaseRedirect turns /customerFeedback → /customerfeedback (no hyphen)
    # but the canonical URL is /customer-feedback (with hyphen)
    location ~ ^/(en|ae|ar)/customerfeedback$ {
        return 301 $scheme://$host/$1/customer-feedback$is_args$args;
    }

    # ── Redirect /ourfleet (broken sub-component page) → canonical fleet list ──
    location ~ ^/(en|ae|ar)/ourfleet$ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }

    # ── Redirect /en/cars → /en/ourfleetlist ──
    location ~ ^/(en|ae|ar)/cars$ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }

    # ── Server-side 301s for camelCase paths (handles Google's cached URLs) ──
    location ~ ^/(en|ae|ar)/forgetPassword$ {
        return 301 $scheme://$host/$1/forgetpassword$is_args$args;
    }
    location ~ ^/(en|ae|ar)/resetPassword$ {
        return 301 $scheme://$host/$1/resetpassword$is_args$args;
    }
    location ~ ^/(en|ae|ar)/bookingDetails(/.*)?$ {
        return 301 $scheme://$host/$1/bookingdetails$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/bookingDetailsTwo(/.*)?$ {
        return 301 $scheme://$host/$1/bookingdetailstwo$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/carEnquriry$ {
        return 301 $scheme://$host/$1/carenquriry$is_args$args;
    }
    location ~ ^/(en|ae|ar)/eCarList$ {
        return 301 $scheme://$host/$1/ecarlist$is_args$args;
    }
    location ~ ^/(en|ae|ar)/commercialVehicles$ {
        return 301 $scheme://$host/$1/commercialvehicles$is_args$args;
    }
    location ~ ^/(en|ae|ar)/MyAccount(/.*)?$ {
        return 301 $scheme://$host/$1/myaccount$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/CarDetails$ {
        return 301 $scheme://$host/$1/cars$is_args$args;
    }
    location ~ ^/(en|ae|ar)/PaymentSuccess$ {
        return 301 $scheme://$host/$1/paymentsuccess$is_args$args;
    }
    location = /PaymentSuccess {
        return 301 $scheme://$host/paymentsuccess$is_args$args;
    }
    location ~ ^/(en|ae|ar)/PaymentFailed$ {
        return 301 $scheme://$host/$1/paymentfailed$is_args$args;
    }
    location = /PaymentFailed {
        return 301 $scheme://$host/paymentfailed$is_args$args;
    }

    # ── CamelCase routes Google has crawled but didn't have server-side 301s ──
    location ~ ^/(en|ae|ar)/Offerspage$ {
        return 301 $scheme://$host/$1/offerspage$is_args$args;
    }
    location ~ ^/(en|ae|ar)/OffersDetails/(.*) {
        return 301 $scheme://$host/$1/offersdetails/$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/OurFleetList$ {
        return 301 $scheme://$host/$1/ourfleetlist$is_args$args;
    }
    location ~ ^/(en|ae|ar)/(AboutUae|aboutuae)$ {
        return 301 $scheme://$host/$1/discover-morocco$is_args$args;
    }
    location ~ ^/(en|ae|ar)/OtherBlog$ {
        return 301 $scheme://$host/$1/otherblog$is_args$args;
    }
    location ~ ^/(en|ae|ar)/CareersPage(/.*)?$ {
        return 301 $scheme://$host/$1/careerspage$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/PrivacyPolicy$ {
        return 301 $scheme://$host/$1/privacypolicy$is_args$args;
    }
    location ~ ^/(en|ae|ar)/Login$ {
        return 301 $scheme://$host/$1/login$is_args$args;
    }
    location ~ ^/(en|ae|ar)/Register$ {
        return 301 $scheme://$host/$1/register$is_args$args;
    }
    location ~ ^/(en|ae|ar)/Location$ {
        return 301 $scheme://$host/$1/location$is_args$args;
    }
    location ~ ^/(en|ae|ar)/EmirateService/(.*) {
        return 301 $scheme://$host/$1/emirateservice/$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/EmirateNeighbourhood/(.*) {
        return 301 $scheme://$host/$1/emirateneighbourhood/$2$is_args$args;
    }
    location ~ ^/(en|ae|ar)/ContectUsPage$ {
        return 301 $scheme://$host/$1/contact-us$is_args$args;
    }
    location ~ ^/(en|ae|ar)/LeasingCorporatePage$ {
        return 301 $scheme://$host/$1/corporate-leasing$is_args$args;
    }

    # ── CamelCase routes still being crawled (Apr 2026) ──
    location ~ ^/(en|ae|ar)/TermsCondition$ {
        return 301 $scheme://$host/$1/termscondition$is_args$args;
    }
    location ~ ^/(en|ae|ar)/FqaPage$ {
        return 301 $scheme://$host/$1/faq$is_args$args;
    }
    location ~ ^/(en|ae|ar)/Contact$ {
        return 301 $scheme://$host/$1/contact$is_args$args;
    }
    location ~ ^/(en|ae|ar)/Lostandfound$ {
        return 301 $scheme://$host/$1/lostandfound$is_args$args;
    }
    location ~ ^/(en|ae|ar)/EmirateLandmark/(.*) {
        return 301 $scheme://$host/$1/emiratelandmark/$2$is_args$args;
    }

    # ── Legacy path aliases still being crawled ──
    location ~ ^/(en|ae|ar)/offers$ {
        return 301 $scheme://$host/$1/offerspage$is_args$args;
    }
    location ~ ^/(en|ae|ar)/forgot-password$ {
        return 301 $scheme://$host/$1/forgetpassword$is_args$args;
    }

    # ── /ar/ prefix → /ae/ (Arabic uses 'ae' internally) ──
    location ~ ^/ar(/.*)?$ {
        return 301 $scheme://$host/ae$1$is_args$args;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Cache static assets — also carry over security headers explicitly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Handle React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Error pages
    error_page 403 /index.html;
    error_page 404 /index.html;
}

